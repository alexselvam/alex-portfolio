<section #contactSection id="contact" class="contact-section">

  <!-- Background Text -->
  <div class="bg-text" [style.transform]="'translateY(' + bgTranslate + 'px)'">
    <h1>CONTACT</h1>
  </div>

  <!-- Contact Card -->
  <div class="contact-wrapper">

    <div
      class="contact-card"
      data-aos="fade-up">

      <div class="reach-title">
        Reach Us
      </div>

      <form>

        <!-- Top -->

        <div class="top-section">

          <!-- Left -->

          <div class="left">

            <div class="field">
              <input
                type="text"
                placeholder="First Name">
            </div>

            <div class="field">
              <input
                type="text"
                placeholder="Last Name">
            </div>

            <div class="field">
              <input
                type="email"
                placeholder="Email">
            </div>

          </div>

          <!-- Right -->

          <div class="right">

            <textarea
              placeholder="Type your message here">
            </textarea>

          </div>

        </div>

        <!-- Bottom -->

        <div class="bottom-section">

          <!-- Checkbox -->

          <div class="permission">

            <input
              type="checkbox"
              id="permission">

            <label for="permission">
              I give permission to contact me at this email address.
            </label>

          </div>

          <!-- Text -->

          <div class="details">

            <p>
              This site is protected by reCAPTCHA and the
              <a href="#">Google Privacy Policy</a>
              and
              <a href="#">Terms of Service</a>
              apply.
            </p>

            <div class="footer-area">

              <p>
                For information on how to unsubscribe,
                please review our
                <a href="#">privacy policy</a>.
              </p>

              <button>

                Send

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor">

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M14 5l7 7m0 0l-7 7m7-7H3"/>

                </svg>

              </button>

            </div>

          </div>

        </div>

      </form>

    </div>

  </div>

</section>
