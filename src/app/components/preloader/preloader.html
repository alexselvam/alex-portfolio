
<div class="preloader" *ngIf="isLoading">
  <div class="loader-bg">
    <span class="glow glow-one"></span>
    <span class="glow glow-two"></span>
    <div class="grid-overlay"></div>
  </div>

  <div class="loader-content">
    <div class="orbit orbit-one"></div>
    <div class="orbit orbit-two"></div>

    <div class="logo-container">
      <div class="logo-shadow">Alex<span>.</span></div>

      <div class="logo-bg">Alex<span>.</span></div>

      <div class="logo-fill">
        Alex<span class="dot">.</span>
      </div>
    </div>

    <div class="loader-line">
      <span class="loader-progress"></span>
    </div>

    <div class="loader-footer">
      <span>INITIALIZING PORTFOLIO</span>
      <span class="loader-percent">100%</span>
    </div>

    <div class="loader-tag">DESIGN · DEVELOP · INNOVATE</div>
  </div>

  <div class="corner-text">ALEX.DEV / 2026</div>
</div>
